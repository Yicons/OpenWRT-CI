#CI项目
name: 03-IPQ-More

#CI计划
on:
  #自动检查：当 01-Build-Check 运行完成后
  workflow_run:
    workflows: ["01-Build-Check"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean
      FORCE:
        description: '忽略源码更新检查，强制重新编译。'
        default: 'false'
        required: false
        type: boolean

#CI权限
permissions: write-all


#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}} · ${{matrix.SOURCE}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [IPQ60XX-WIFI-NO, IPQ60XX-WIFI-YES]
        # King-Of-Knights/openwrt-6.x,
        SOURCE: [LiBwrt-op/openwrt-6.x, VIKINGYFY/immortalwrt]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: vantage
      #默认主机名
      WRT_NAME: ''
      #默认WIFI名称
      WRT_SSID: ''
      #默认WIFI密码
      WRT_WORD: ''
      #默认地址
      WRT_IP: 10.10.2.40
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #VIKINGYFY 的 main 是高通专用满血 NSS；其他源码自动跟随默认分支
      WRT_BRANCH: ${{matrix.SOURCE == 'VIKINGYFY/immortalwrt' && 'main' || ''}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
      #自动运行时仅在源码更新后编译；手动可选择强制编译
      WRT_AUTO: true
      WRT_FORCE: ${{inputs.FORCE || false}}
