#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: false
        default: ''
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean
      WRT_AUTO:
        required: false
        default: false
        type: boolean
      WRT_FORCE:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_AUTO: ${{inputs.WRT_AUTO}}
  WRT_FORCE: ${{inputs.WRT_FORCE}}

jobs:
  source-check:
    name: Check ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      build: ${{steps.check.outputs.build}}
      source_hash: ${{steps.check.outputs.source_hash}}
      build_hash: ${{steps.check.outputs.build_hash}}
      branch: ${{steps.check.outputs.branch}}
    steps:
      - name: Checkout build definitions
        uses: actions/checkout@main

      - name: Compare with last successful firmware
        id: check
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          RESOLVED_BRANCH="$WRT_BRANCH"
          if [[ -z "$RESOLVED_BRANCH" ]]; then
            DEFAULT_REF=$(git ls-remote --symref "$WRT_REPO" HEAD | awk '$1 == "ref:" { print $2; exit }')
            RESOLVED_BRANCH=${DEFAULT_REF#refs/heads/}
          fi

          if [[ -z "$RESOLVED_BRANCH" ]]; then
            echo "Unable to resolve the default branch of $WRT_REPO" >&2
            exit 1
          fi

          REMOTE_HASH=$(git ls-remote "$WRT_REPO" "refs/heads/$RESOLVED_BRANCH" | awk 'NR == 1 { print $1 }')
          if [[ ! "$REMOTE_HASH" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve $WRT_REPO branch $RESOLVED_BRANCH" >&2
            exit 1
          fi

          # 只计算会影响当前固件的仓库内容；README 等无关文件不会触发编译。
          BUILD_HASH=$(
            {
              printf '%s\n' \
                "config=$WRT_CONFIG" \
                "theme=$WRT_THEME" \
                "name=$WRT_NAME" \
                "ssid=$WRT_SSID" \
                "word=$WRT_WORD" \
                "ip=$WRT_IP" \
                "password=$WRT_PW" \
                "repo=$WRT_REPO" \
                "branch=$RESOLVED_BRANCH" \
                "source=$WRT_SOURCE" \
                "packages=$WRT_PACKAGE"

              git ls-files -z -- \
                "Config/$WRT_CONFIG.txt" \
                Config/GENERAL.txt \
                Config/PRIVATE.txt \
                Scripts \
                Patch \
                .github/scripts \
                .github/workflows/WRT-CORE.yml |
                while IFS= read -r -d '' FILE; do
                  sha256sum "$FILE"
                done
            } | sha256sum | awk '{ print $1 }'
          )

          echo "source_hash=$REMOTE_HASH" >> "$GITHUB_OUTPUT"
          echo "build_hash=$BUILD_HASH" >> "$GITHUB_OUTPUT"
          echo "branch=$RESOLVED_BRANCH" >> "$GITHUB_OUTPUT"

          if [[ "$WRT_AUTO" != "true" || "$WRT_FORCE" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Build check"
              echo "- Config: $WRT_CONFIG"
              echo "- Source: $WRT_REPO"
              echo "- Branch: $RESOLVED_BRANCH"
              echo "- Source commit: $REMOTE_HASH"
              echo "- Build inputs: $BUILD_HASH"
              echo "- Result: manual or forced build"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RELEASES=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          LAST_BODY=$(jq -r \
            --arg source "$WRT_REPO" \
            --arg branch "$RESOLVED_BRANCH" \
            --arg config "$WRT_CONFIG" '
            (first(.[][]
              | select((.body // "") | contains("源码：" + $source))
              | select((.body // "") | contains("分支：" + $branch))
              | select((.body // "") | contains("配置：" + $config))
              | (.body // "")) // "")
          ' <<< "$RELEASES")

          LAST_SOURCE_HASH=$(sed -n 's/^提交：\([0-9A-Fa-f]\{7,40\}\).*$/\1/p' <<< "$LAST_BODY" | head -n 1)
          LAST_BUILD_HASH=$(sed -n 's/^构建指纹：\([0-9A-Fa-f]\{64\}\).*$/\1/p' <<< "$LAST_BODY" | head -n 1)

          {
            echo "### Build check"
            echo "- Config: $WRT_CONFIG"
            echo "- Source: $WRT_REPO"
            echo "- Branch: $RESOLVED_BRANCH"
            echo "- Source commit: $REMOTE_HASH"
            echo "- Last source commit: ${LAST_SOURCE_HASH:-none}"
            echo "- Build inputs: $BUILD_HASH"
            echo "- Last build inputs: ${LAST_BUILD_HASH:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$REMOTE_HASH" == "$LAST_SOURCE_HASH" && "$BUILD_HASH" == "$LAST_BUILD_HASH" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "- Result: source and build inputs unchanged, skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "- Result: source or build inputs changed, build required" >> "$GITHUB_STEP_SUMMARY"
          fi

  core:
    name: ${{inputs.WRT_SOURCE}}
    needs: source-check
    if: ${{needs.source-check.outputs.build == 'true'}}
    runs-on: ubuntu-latest
    env:
      WRT_BRANCH: ${{needs.source-check.outputs.branch}}
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq purge firefox
          sudo apt-get -yqq update
          sudo apt-get -yqq autoremove --purge
          sudo apt-get -yqq autoclean
          sudo apt-get -yqq clean

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libfuse-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-netifaces python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd

          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          for ATTEMPT in 1 2 3; do
            echo "Clone source: attempt $ATTEMPT/3"
            if git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/; then
              break
            else
              CLONE_STATUS=$?
            fi

            if [ "$ATTEMPT" -eq 3 ]; then
              echo "Source clone failed after 3 attempts (exit $CLONE_STATUS)." >&2
              exit "$CLONE_STATUS"
            fi

            echo "Source clone failed (exit $CLONE_STATUS); retrying in 15 seconds."
            sleep 15
          done

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_BUILD_HASH=${{needs.source-check.outputs.build_hash}}" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            jq 'walk(
              if type == "array"
                then map(select(test("tencent|aliyun|\\.cn") | not))
                else .
              end
            )' "$PROJECT_MIRRORS_FILE" > "$PROJECT_MIRRORS_FILE.tmp"
            mv "$PROJECT_MIRRORS_FILE.tmp" "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh
          $GITHUB_WORKSPACE/Scripts/Custom.sh
          bash $GITHUB_WORKSPACE/Scripts/MenuLayout.sh
          bash $GITHUB_WORKSPACE/Scripts/Optional.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Prepare Rust Toolchain
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc) || make download -j1 V=s

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Collect Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        if: ${{ !inputs.WRT_TEST }}
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}
            构建指纹：${{env.WRT_BUILD_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

      - name: Delete Older Matching Releases
        if: ${{ !inputs.WRT_TEST }}
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          CURRENT_TAG: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
        run: |
          if ! RELEASES=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100"); then
            echo "::warning::Unable to list old firmware releases"
            exit 0
          fi

          OLD_TAGS=$(jq -r \
            --arg source "$WRT_REPO" \
            --arg branch "$WRT_BRANCH" \
            --arg config "$WRT_CONFIG" \
            --arg current "$CURRENT_TAG" '
            .[][]
              | select(.tag_name != $current)
              | select((.body // "") | contains("源码：" + $source))
              | select((.body // "") | contains("分支：" + $branch))
              | select((.body // "") | contains("配置：" + $config))
              | .tag_name
          ' <<< "$RELEASES")

          if [[ -z "$OLD_TAGS" ]]; then
            echo "No older release matches $WRT_CONFIG / $WRT_REPO / $WRT_BRANCH"
            exit 0
          fi

          while IFS= read -r OLD_TAG; do
            [[ -z "$OLD_TAG" ]] && continue
            echo "Deleting old release and tag: $OLD_TAG"
            gh release delete "$OLD_TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" ||
              echo "::warning::Unable to delete old release $OLD_TAG"
          done <<< "$OLD_TAGS"

      - name: Upload Test Config
        if: ${{ inputs.WRT_TEST }}
        uses: actions/upload-artifact@v7
        with:
          name: test-config-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./wrt/upload/
          retention-days: 7

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
