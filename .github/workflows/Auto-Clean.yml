name: Auto-Clean

on:
  # X86 或 IPQ 检查/编译完成后自动清理旧运行记录
  workflow_run:
    workflows: ["X86-More", "IPQ-More"]
    types:
      - completed
  #手动清理
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          # Release 由 WRT-CORE 按“配置 + 源码 + 分支”保留最新版，这里不做全局删除。
          delete_releases: false
          delete_tags: false
          delete_workflows: true
          # 保留最近一天，避免刚完成的日志立刻消失，便于排查编译错误。
          workflows_keep_day: 1
